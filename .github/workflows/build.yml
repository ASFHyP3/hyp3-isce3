name: Build

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  version-info:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      version: ${{ steps.set_outputs.outputs.version }}
      version_tag: ${{ steps.set_outputs.outputs.version_tag }}
      repo: ${{ steps.set_outputs.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          activate-environment: true

      - name: set outputs
        id: set_outputs
        run: |
          export REPO="${{ github.repository }}"
          REPO="${REPO,,}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          export SDIST_VERSION=$(python -m setuptools_scm)
          SDIST_VERSION=${SDIST_VERSION:-dev}
          echo "version=${SDIST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${SDIST_VERSION/+/_}" >> "$GITHUB_OUTPUT"
          echo "Version number: ${SDIST_VERSION}"

  dockerize:
    needs: version-info
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.platform }}-${{ matrix.variant }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile
            variant: cpu

          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile
            variant: cpu

          - platform: linux/amd64
            runner: ubuntu-24.04
            dockerfile: Dockerfile.gpu
            variant: gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set environment variables
        run: |
          echo "CI_JOB_TIMESTAMP=$(date --utc --rfc-3339=seconds)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        if: ${{ !env.act }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag, and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: ./${{ matrix.dockerfile }}
          tags: |
            ghcr.io/${{ needs.version-info.outputs.repo }}
          labels: |
            org.opencontainers.image.created=${{ env.CI_JOB_TIMESTAMP }}
            org.opencontainers.image.version=${{ needs.version-info.outputs.version_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=build-project-deps-${{ matrix.variant }}-linux-amd64
            type=gha,scope=build-project-deps-${{ matrix.variant }}-linux-arm64
          cache-to: type=gha,mode=max,scope=build-project-deps-${{ matrix.variant }}-${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.head.repo.fork }}
    permissions:
      contents: read
      packages: write
    needs:
      - version-info
      - dockerize
    strategy:
      matrix:
        variant:
          - cpu
          - gpu

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        if: ${{ !env.act }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        env:
          VERSION_TAG: ${{ needs.version-info.outputs.version_tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "gpu" ]; then
            echo "version_tag=${VERSION_TAG}-gpu" >> "$GITHUB_OUTPUT"
          else
            echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.version-info.outputs.repo }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version_tag }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ needs.version-info.outputs.repo }}@sha256:%s ' *)

      - name: Add test tag
        if: ${{ github.event_name != 'pull_request' && matrix.variant == 'cpu' && contains(needs.version-info.outputs.version_tag, '.dev') }}
        uses: akhilerm/tag-push-action@v2.3.0
        with:
          src: ghcr.io/${{ needs.version-info.outputs.repo }}:${{ steps.tag.outputs.version_tag }}
          dst: ghcr.io/${{ needs.version-info.outputs.repo }}:test

      - name: Add latest tag
        if: ${{ github.event_name != 'pull_request' && matrix.variant == 'cpu' && !contains(needs.version-info.outputs.version_tag, '.dev') }}
        uses: akhilerm/tag-push-action@v2.3.0
        with:
          src: ghcr.io/${{ needs.version-info.outputs.repo }}:${{ steps.tag.outputs.version_tag }}
          dst: ghcr.io/${{ needs.version-info.outputs.repo }}:latest

      - name: Add GPU tag
        if: ${{ github.event_name != 'pull_request' && matrix.variant == 'gpu' }}
        uses: akhilerm/tag-push-action@v2.3.0
        with:
          src: ghcr.io/${{ needs.version-info.outputs.repo }}:${{ steps.tag.outputs.version_tag }}
          dst: ghcr.io/${{ needs.version-info.outputs.repo }}:GPU

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hyp3_isce3"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="username_for_github_actions", email="email_for@github_actions.com"},
]
description = "HyP3 plugin for isce3 processing."
license = {text = "BSD-3-Clause"}
classifiers=[
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "boto3",
    # TODO: insert Python dependencies as list here
]
dynamic = ["version"]

[project.optional-dependencies]
develop = [
    "setuptools_scm",
    "mypy",
    "ruff",
    "pytest",
    "pytest-console-scripts",
    "pytest-cov",
]

[project.scripts]
hyp3_isce3 = "hyp3_isce3.__main__:main"

[project.urls]
Homepage = "https://github.com/ASFHyP3/hyp3-isce3"
Documentation = "https://hyp3-docs.asf.alaska.edu"

[tool.pytest.ini_options]
testpaths = ["tests"]
script_launch_mode = "subprocess"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

# Please keep the following ruff options up-to-date with https://github.com/ASFHyP3/actions/#reusable-ruffyml
[tool.ruff]
line-length = 120
# The directories to consider when resolving first- vs. third-party imports.
# See: https://docs.astral.sh/ruff/settings/#src
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    "I",   # isort: https://docs.astral.sh/ruff/rules/#isort-i
    "UP",  # pyupgrade: https://docs.astral.sh/ruff/rules/#pyupgrade-up
    "D",   # pydocstyle: https://docs.astral.sh/ruff/rules/#pydocstyle-d
    "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
    "PTH", # use-pathlib-pth: https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
case-sensitive = true
lines-after-imports = 2

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["D1", "ANN"]

# Please keep the following mypy options up-to-date with https://github.com/ASFHyP3/actions/#reusable-mypyyml
[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
install_types = true
non_interactive = true
pretty = true
disable_error_code = ["import-untyped"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-64", "osx-arm64"]

[tool.pixi.pypi-options]
no-build-isolation = ['isce3']

[tool.pixi.dependencies]
pip = "*"
asf_search = "*"
boto3 = "*"
botocore = "*"
burst2safe = ">=1.4.4"
earthaccess = "*"
ecmwf-api-client="*"
gdal = ">=3"
geopandas="*"
h5netcdf = "*"
herbie-data="<2025.2.1"
hyp3lib = ">=4,<5"
libgdal-netcdf = "*"
libgdal-jp2openjpeg = "*"
matplotlib-base = "*"
netcdf4 = "*"
numpy = "<2.4"
opencv = "*"
pandas = ">=1.4,<3.0"
pyaps3="*"
pydap="*"
pygrib="*"
pyproj = ">=3.3"
python-dateutil = "*"
rasterio="*"
requests = ">=2.0"
scipy = ">=1.0"
utm = "*"
xarray = "*"
# For building radar deps
cxx-compiler = "*"
gfortran = "*"
eigen = ">=3.3.7,<4"
numba = "*"
scikit-image = "*"
pkgconfig = "*"
gtest = "*"
fftw = "*"
pybind11 = "*"
rioxarray="*"
ruamel = "*"
"ruamel.yaml" = "*"
yamale = "*"
backoff = "*"
pysolid = "*"
# For PyCharm IDE integration
pixi-pycharm = ">=0.0.8,<0.0.9"


[tool.pixi.target.linux-64.dependencies]
pyre = "*"

[tool.pixi.target.linux-aarch64.pypi-dependencies]
pyre = "*"

[tool.pixi.target.osx-64.dependencies]
pyre = "*"

[tool.pixi.target.osx-arm64.dependencies]
pyre = "*"

[tool.pixi.pypi-dependencies]
snaphu = "*"
raider = {git = "https://github.com/dbekaert/RAiDER.git", rev = "v0.5.3"}

[tool.pixi.feature.pycharm.dependencies]
pixi-pycharm = "*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = { features = ["develop", "pycharm"], solve-group = "default" }
py312 = { features = ["develop", "py312"]}
py313 = { features = ["develop", "py313"]}
py314 = { features = ["develop", "py314"], solve-group = "default"}


[tool.pixi.tasks.install-isce3]
cmd = [
    "python",
    "-m",
    "pip",
    "install",
    "git+https://github.com/isce-framework/isce3.git@bd58fcd3dad94f7f06871f927b902eca20680439"
]
depends-on = []

[tool.pixi.tasks.install-editable]
cmd = [
    "python",
    "-m",
    "pip",
    "install",
    "-e",
    ".",
]
depends-on = ["install-isce3"]

[tool.pixi.tasks.tests]
cmd = [
    "pytest",
    "--cov=hyp3_isce3",
]
depends-on = ["install-editable"]
